<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ed">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>NAI 口袋词库</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./gallery.css">
  <script src="./sources.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./gallery.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M12 2.8l1.9 6.3 6.3 1.9-6.3 2-1.9 6.2-2-6.2-6.2-2 6.2-1.9L12 2.8zM19.5 14.5l.8 2.7 2.7.8-2.7.8-.8 2.7-.8-2.7L16 18l2.7-.8z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15 15 4.5 4.5"/></symbol>
    <symbol id="i-character" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.2"/><path d="M4.8 20v-1.5a7.2 7.2 0 0 1 14.4 0V20z"/></symbol>
    <symbol id="i-artist" viewBox="0 0 24 24"><path d="M20 10.2c0-3.8-3.5-6.8-8-6.8a8.6 8.6 0 0 0-8.5 8.5 8.3 8.3 0 0 0 8.1 8.7c2 0 2.6-1.4 2.1-2.8-.5-1.5.4-2.6 2-2.6 2.8 0 4.3-2.1 4.3-5z"/><path d="M7.8 11h.1m2.6-3h.1m3.9 0h.1m2.5 2.7h.1"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C9.5 4.7 6.2 4.6 3 5.6v13.7c3.2-1 6.5-.9 9 1 2.5-1.9 5.8-2 9-1V5.6c-3.2-1-6.5-.9-9 1zm0 0v13.8"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.4"/><path d="M16 8V6.4A2.4 2.4 0 0 0 13.6 4H6.4A2.4 2.4 0 0 0 4 6.4v7.2A2.4 2.4 0 0 0 6.4 16H8"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4.5 12h14.8m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19.5 12H4.7m6-6-6 6 6 6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9.6" r="1.4"/><path d="m4 17 4.3-3.8 3 2.2 4.6-5 4.2 4.2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4.1l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  </svg>

  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><svg><use href="#i-mark"/></svg></span><span>NAI 口袋词库</span></div>
      <div class="top-actions"><button id="tools" class="soft compact" type="button">工具</button><button id="add" class="primary compact" type="button"><svg><use href="#i-plus"/></svg>新增</button></div>
    </header>
    <main id="main">
      <div id="update-notice" class="update-notice" aria-live="polite" hidden></div>
      <section class="intro">
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="title"></h1>
        <p id="subtitle" class="muted intro-text"></p>
      </section>
      <div class="segmented" aria-label="词库范围">
        <button id="personal" type="button">我的词库</button>
        <button id="online" type="button">在线资源</button>
      </div>
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="query" type="search" inputmode="search" autocomplete="off" aria-label="搜索条目">
      </label>
      <div id="resource-tabs" class="filters" aria-label="知识资源范围"></div>
      <div id="filters" class="filters" aria-label="分类筛选"></div>
      <div id="view-options" class="view-options" aria-label="显示方式"></div>
      <div id="artist-discovery" class="artist-discovery" aria-label="画师浏览" hidden></div>
      <div id="list-meta" class="list-meta" aria-live="polite"></div>
      <div id="results"></div>
    </main>
    <nav id="nav" class="nav" aria-label="词库分类">
      <button type="button" data-section="character"><svg><use href="#i-character"/></svg>同人角色</button>
      <button type="button" data-section="artist"><svg><use href="#i-artist"/></svg>画师</button>
      <button type="button" data-section="knowledge"><svg><use href="#i-book"/></svg>画面提示词知识</button>
      <button type="button" id="gallery"><svg><use href="#i-image"/></svg>图库</button>
    </nav>
  </div>

  <dialog id="screen" class="screen">
    <div class="screen-inner">
      <header class="screen-head">
        <button id="close" class="icon-button" type="button" aria-label="返回"><svg><use href="#i-back"/></svg></button>
        <span id="screen-title"></span>
      </header>
      <div id="screen-body" class="screen-body"></div>
      <div id="screen-actions" class="screen-actions"></div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="web-photo" type="file" accept="image/*" hidden>
</body>
</html>
